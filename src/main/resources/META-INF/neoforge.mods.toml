modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issues_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
logoFile = "assets/mcvmcomputers/icon.png"
authors = "${mod_authors}"
description = """${mod_description}"""

[[mixins]]
config = "mcvmcomputers.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
ordering = "NONE"
versionRange = "${neo_version_range}"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
ordering = "NONE"
versionRange = "${minecraft_version_range}"
