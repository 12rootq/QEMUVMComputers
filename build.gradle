plugins {
	id 'dev.architectury.loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
	id 'java'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

loom {
	silentMojangMappingsLicense()

	forge {
		// Register the mod's mixin config so Forge loads it (Loom writes it to the
		// jar manifest and generates the mixin refmap automatically).
		mixinConfig "mcvmcomputers.mixins.json"
	}

	// Generate the Forge mixin refmap under the mod id to avoid collisions.
	mixin {
		defaultRefmapName = "mcvmcomputers.refmap.json"
	}
}

repositories {
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.architectury.dev/" }
	maven { url "https://maven.minecraftforge.net/" }
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Keep Yarn mappings: Architectury Loom remaps Forge (SRG) to Yarn names so the
	// existing net.minecraft.* Yarn references keep compiling unchanged.
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	forge "net.minecraftforge:forge:${project.forge_version}"

	// Test dependencies (kept from the Fabric build)
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.1"
	testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.1"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.1"
	testImplementation "net.jqwik:jqwik:1.8.2"
}

test {
	useJUnitPlatform {
		includeEngines 'junit-jupiter', 'jqwik'
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

// Ensure that the encoding is set to UTF-8, no matter what the system default is.
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
	options.release = 17
}

java {
	withSourcesJar()
}

jar {
	from "LICENSE"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
