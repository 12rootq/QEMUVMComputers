plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

dependencies {
	//to change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	 
	implementation files('lib/vboxjws.jar')
	shadow files('lib/vboxjws.jar')

	implementation 'jakarta.xml.ws:jakarta.xml.ws-api:2.3.3'
	shadow 'jakarta.xml.ws:jakarta.xml.ws-api:2.3.3'
	implementation 'com.sun.xml.ws:jaxws-rt:2.3.5'
	shadow 'com.sun.xml.ws:jaxws-rt:2.3.5'

	implementation 'xml-resolver:xml-resolver:1.2'
	shadow 'xml-resolver:xml-resolver:1.2'
}

shadowJar {
	 configurations = [project.configurations.shadow]
	 archiveBaseName = "${project.archives_base_name}"
	 archiveClassifier = 'dev'
	 archiveVersion = "${project.mod_version}"

	 relocate 'com.sun.org.apache.xml.internal.resolver', 'org.apache.xml.resolver'
}

remapJar {
	inputFile = shadowJar.archiveFile
	dependsOn shadowJar
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	archiveClassifier = "sources"
	from sourceSets.main.allSource
}

jar {
	from "LICENSE"
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
